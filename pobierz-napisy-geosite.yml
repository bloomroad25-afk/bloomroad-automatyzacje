name: Pobieranie napisow - GeoSite

on:
  # Co godzine, mniej wiecej od 6:00 do 22:00 czasu polskiego (UTC 4-20).
  schedule:
    - cron: "22 4-20 * * *"
  # Reczne uruchomienie (test): Actions > Pobieranie napisow - GeoSite > Run workflow.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = tylko sprawdza, nic nie zapisuje"
        default: "true"

# Tylko jedno sprawdzanie naraz.
concurrency:
  group: pobierz-napisy-geosite
  cancel-in-progress: false

jobs:
  sprawdz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Pobierz napisy (GeoSite)
        run: python pobierz_napisy.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_GEOSITE }}
          # Baza "Odcinki - GeoSite"
          DATA_SOURCE_ID: "9d765017-8105-4c72-9bff-6eee9ada509a"
          # Baza "Napisy YouTube - GeoSite (automat - nie ruszac)"
          NAPISY_DATA_SOURCE_ID: "28378b78-53ce-443d-9afb-7c170913e60a"
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
