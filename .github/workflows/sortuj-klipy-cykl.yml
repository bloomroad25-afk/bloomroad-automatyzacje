name: Sortowanie klipow - cykl (wszyscy klienci)

on:
  # Co 15 minut sprawdza bazy Odcinki z pliku sortowanie_klienci.json i sortuje
  # kazdy odcinek z zaznaczonym "Posortuj klipy". Godziny w UTC (7-21 = 9-23 w Polsce latem).
  schedule:
    - cron: "*/15 5-21 * * *"
  # Reczne uruchomienie: Actions > Sortowanie klipow - cykl > Run workflow.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = tylko podglad, nic nie przenosi"
        default: "true"

concurrency:
  group: sortuj-cykl
  cancel-in-progress: false

jobs:
  sortuj:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Sortuj klipy zaznaczone w Notion
        run: python sortuj_klipy.py
        env:
          # Zmienna repozytorium DRY_RUN: "true" = podglad (domyslnie), "false" = naprawde przenosi.
          DRY_RUN: ${{ github.event.inputs.dry_run || vars.DRY_RUN || 'true' }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          RESULT_WEBHOOK_URL: ${{ secrets.RESULT_WEBHOOK_URL }}
