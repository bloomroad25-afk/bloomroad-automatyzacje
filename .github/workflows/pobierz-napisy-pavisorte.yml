name: Pobieranie napisow - Pavisorte

on:
  # Co 15 minut, mniej wiecej od 6:00 do 22:00 czasu polskiego (UTC 4-20).
  schedule:
    - cron: "7,22,37,52 4-20 * * *"
  # Reczne uruchomienie (test): Actions > Pobieranie napisow - Pavisorte > Run workflow.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = tylko sprawdza, nic nie zapisuje"
        default: "true"

# Tylko jedno sprawdzanie naraz.
concurrency:
  group: pobierz-napisy-pavisorte
  cancel-in-progress: false

jobs:
  sprawdz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Pobierz napisy (Pavisorte)
        run: python pobierz_napisy.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_PAVISORTE }}
          # Baza "Odcinki - Pavisorte"
          DATA_SOURCE_ID: "85286936-83bb-4ae3-8592-5a7b7792bc5e"
          # Baza "Napisy YouTube - Pavisorte (automat - nie ruszac)"
          NAPISY_DATA_SOURCE_ID: "617af5f4-f29d-4186-b37b-b7b5528917d3"
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
