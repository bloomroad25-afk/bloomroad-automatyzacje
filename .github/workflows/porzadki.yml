name: Porzadki - max 2 opublikowane odcinki

on:
  # Raz w tygodniu, w poniedzialek o 04:30 UTC (06:30 lub 05:30 w Polsce).
  schedule:
    - cron: "30 4 * * 1"
  # Reczne uruchomienie: Actions > Porzadki > Run workflow.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = tylko raport, nic nie zmienia"
        default: "true"

concurrency:
  group: porzadki
  cancel-in-progress: false

jobs:
  porzadki:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Porzadki w Notion i na Dysku
        run: python porzadki.py
        env:
          # Osobna zmienna PORZADKI_DRY_RUN (true = podglad). Dopoki jej nie ustawisz, to podglad.
          DRY_RUN: ${{ github.event.inputs.dry_run || vars.PORZADKI_DRY_RUN || 'true' }}
          LIMIT: "2"
          MAX_PER_RUN: "5"
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          RESULT_WEBHOOK_URL: ${{ secrets.RESULT_WEBHOOK_URL }}
