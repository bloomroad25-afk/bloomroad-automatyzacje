name: Test napisow YouTube

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "ID filmu na YouTube (np. vfgbp43CLZY)"
        default: "vfgbp43CLZY"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Sprawdz napisy
        run: python test_napisy_youtube.py
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          VIDEO_ID: ${{ github.event.inputs.video_id }}
