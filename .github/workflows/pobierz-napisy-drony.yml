name: Pobieranie napisow - Drony Dla Firmy

on:
  # Co 15 minut, mniej wiecej od 6:00 do 22:00 czasu polskiego (UTC 4-20).
  schedule:
    - cron: "6,21,36,51 4-20 * * *"
  # Reczne uruchomienie (test): Actions > Pobieranie napisow - Drony Dla Firmy > Run workflow.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = tylko sprawdza, nic nie zapisuje"
        default: "true"

# Tylko jedno sprawdzanie naraz.
concurrency:
  group: pobierz-napisy-drony
  cancel-in-progress: false

jobs:
  sprawdz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Pobierz napisy (Drony Dla Firmy)
        run: python pobierz_napisy.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_DRONY }}
          # Baza "Odcinki - Drony Dla Firmy"
          DATA_SOURCE_ID: "07faa39a-2613-4500-8308-c4e2dd17c6a6"
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
