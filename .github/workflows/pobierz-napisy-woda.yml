name: Pobieranie napisow - Woda Dla Firmy

on:
  # Co 15 minut, mniej wiecej od 6:00 do 22:00 czasu polskiego (UTC 4-20).
  schedule:
    - cron: "12,27,42,57 4-20 * * *"
  # Reczne uruchomienie (test): Actions > Pobieranie napisow - Woda Dla Firmy > Run workflow.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = tylko sprawdza, nic nie zapisuje"
        default: "true"

# Tylko jedno sprawdzanie naraz.
concurrency:
  group: pobierz-napisy-woda
  cancel-in-progress: false

jobs:
  sprawdz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Pobierz napisy (Woda Dla Firmy)
        run: python pobierz_napisy.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_WODA }}
          # Baza "Odcinki - Woda Dla Firmy"
          DATA_SOURCE_ID: "37915a48-0ade-434b-81a8-1d04c495c514"
          # Baza "Napisy YouTube - Woda (automat - nie ruszac)"
          NAPISY_DATA_SOURCE_ID: "29f50a0b-7092-4af9-bffe-58867278c2ef"
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
