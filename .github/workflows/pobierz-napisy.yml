name: Pobieranie napisow

on:
  schedule:
    - cron: "7 4-20 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = tylko sprawdza, nic nie zapisuje"
        default: "true"

concurrency:
  group: pobierz-napisy
  cancel-in-progress: false

jobs:
  sprawdz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Pobierz napisy
        run: python pobierz_napisy.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
