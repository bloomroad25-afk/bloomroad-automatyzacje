name: Pobieranie napisow

on:
  # Co 15 minut, mniej wiecej od 6:00 do 22:00 czasu polskiego (UTC 4-20).
  schedule:
    - cron: "3,18,33,48 4-20 * * *"
  # Reczne uruchomienie (test): Actions > Pobieranie napisow > Run workflow.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = tylko sprawdza, nic nie zapisuje"
        default: "true"

# Tylko jedno sprawdzanie naraz.
concurrency:
  group: pobierz-napisy
  cancel-in-progress: false

jobs:
  sprawdz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Pobierz napisy
        run: python pobierz_napisy.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
